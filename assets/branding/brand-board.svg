<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
<defs><pattern id="studs" width="36" height="36" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="16" height="16" rx="2" fill="#24292E"/><path d="M8 24V8H24" fill="none" stroke="#343B42"/><path d="M24 8V24H8" fill="none" stroke="#080A0C"/></pattern>
<style>text{font-family:Arial,sans-serif;fill:#F5F7FA}.title{font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:64px}.label{font-size:22px;font-weight:700}.hex{font-family:Consolas,monospace;font-size:18px;fill:#ADB6C2}.small{font-size:18px;fill:#ADB6C2}.eyebrow{font-size:16px;letter-spacing:3px;font-weight:700;fill:#B6FF00}</style></defs>
<rect width="1440" height="1080" fill="#171A1D"/><rect width="1440" height="185" fill="url(#studs)"/>
<rect x="40" y="30" width="1360" height="132" rx="8" fill="#171A1D"/>
<text x="56" y="64" class="eyebrow">STEAL A TEMPLATE / BRAND KIT 01</text>
<text x="56" y="128" class="title">GRAB A KIT. <tspan fill="#B6FF00">BUILD SOMETHING.</tspan></text>
<text x="56" y="213" class="eyebrow">01 / THE PALETTE</text><g><rect x="56" y="240" width="312" height="70" rx="8" fill="#171A1D" stroke="#080A0C" stroke-width="3"/><text x="56" y="340" class="label">Baseplate</text><text x="368" y="340" text-anchor="end" class="hex">#171A1D</text><text x="56" y="366" class="small">Page / backdrop</text></g><g><rect x="392" y="240" width="312" height="70" rx="8" fill="#262B30" stroke="#080A0C" stroke-width="3"/><text x="392" y="340" class="label">Panel</text><text x="704" y="340" text-anchor="end" class="hex">#262B30</text><text x="392" y="366" class="small">Cards / raised panels</text></g><g><rect x="728" y="240" width="312" height="70" rx="8" fill="#F5F7FA" stroke="#080A0C" stroke-width="3"/><text x="728" y="340" class="label">Chalk</text><text x="1040" y="340" text-anchor="end" class="hex">#F5F7FA</text><text x="728" y="366" class="small">Primary text</text></g><g><rect x="1064" y="240" width="312" height="70" rx="8" fill="#ADB6C2" stroke="#080A0C" stroke-width="3"/><text x="1064" y="340" class="label">Steel</text><text x="1376" y="340" text-anchor="end" class="hex">#ADB6C2</text><text x="1064" y="366" class="small">Secondary text</text></g><g><rect x="56" y="400" width="312" height="70" rx="8" fill="#B6FF00" stroke="#080A0C" stroke-width="3"/><text x="56" y="500" class="label">Loot Lime</text><text x="368" y="500" text-anchor="end" class="hex">#B6FF00</text><text x="56" y="526" class="small">Primary brand / action</text></g><g><rect x="392" y="400" width="312" height="70" rx="8" fill="#12D9EF" stroke="#080A0C" stroke-width="3"/><text x="392" y="500" class="label">Electric Cyan</text><text x="704" y="500" text-anchor="end" class="hex">#12D9EF</text><text x="392" y="526" class="small">Links / supporting accent</text></g><g><rect x="728" y="400" width="312" height="70" rx="8" fill="#FFD83D" stroke="#080A0C" stroke-width="3"/><text x="728" y="500" class="label">Spawn Yellow</text><text x="1040" y="500" text-anchor="end" class="hex">#FFD83D</text><text x="728" y="526" class="small">Highlights / announcements</text></g><g><rect x="1064" y="400" width="312" height="70" rx="8" fill="#FF453A" stroke="#080A0C" stroke-width="3"/><text x="1064" y="500" class="label">Reset Red</text><text x="1376" y="500" text-anchor="end" class="hex">#FF453A</text><text x="1064" y="526" class="small">Errors / destructive action</text></g>
<path d="M56 573H1384" stroke="#3B434C"/>
<text x="56" y="614" class="eyebrow">02 / TYPE &amp; CONTROLS</text>
<text x="56" y="675" style="font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:46px">CHUNKY. CLEAR. EDITABLE.</text>
<text x="56" y="718" style="font-size:23px">Short headlines. Plain instructions. Studs in the background.</text>
<text x="56" y="753" class="small">Arial Black / Arial / Consolas — use local fallbacks when needed.</text>
<rect x="60" y="791" width="235" height="58" rx="8" fill="#080A0C"/><rect x="56" y="787" width="235" height="58" rx="8" fill="#B6FF00" stroke="#080A0C" stroke-width="3"/><text x="173" y="825" text-anchor="middle" style="fill:#171A1D;font-size:22px;font-weight:900">BROWSE ASSETS</text>
<rect x="315" y="787" width="190" height="58" rx="8" fill="#262B30" stroke="#12D9EF" stroke-width="3"/><text x="410" y="825" text-anchor="middle" style="fill:#12D9EF;font-size:22px;font-weight:700">SETUP GUIDE</text>
<text x="540" y="811" class="small">8 px rhythm / 3 px outlines / hard shadows</text><text x="540" y="838" class="small">Dark text on bright fills. Light text on charcoal.</text>
<path d="M56 884H1384" stroke="#3B434C"/>
<text x="56" y="925" class="eyebrow">03 / READY FOR THE NEXT SURFACE</text>
<text x="56" y="972" class="label">GitHub now. Discord later.</text><text x="56" y="1006" class="small">One identity across banners, asset drops, help, and announcements.</text>
<text x="56" y="1036" class="small">70% dark neutrals / 20% lime / 10% supporting color</text>
<rect x="1210" y="916" width="132" height="132" rx="28" fill="#080A0C"/><rect x="1225" y="931" width="102" height="102" rx="12" fill="#B6FF00"/><text x="1276" y="1003" text-anchor="middle" style="fill:#171A1D;font-family:'Arial Black',Arial,sans-serif;font-size:61px;font-weight:900">ST</text>
</svg>